name: Uncensored Agent (24/7)

# GitHub-এর রানারে চলে: মডেল নামে, সার্ভার ওঠে, তারপর Telegram থেকে কাজ করে।
# কাজ শেষে ওয়ার্কস্পেস + মেমোরি agent-state ব্রাঞ্চে রাখা হয়, তাই পরের রানে
# (প্রতি ৫ ঘণ্টায়) আগের ফাইল আর মনে রাখা তথ্য ফিরে আসে।
on:
  workflow_dispatch:
    inputs:
      model:
        description: "মডেল সাইজ"
        type: choice
        default: "14b"
        options: ["7b", "14b", "32b"]
      hours:
        description: "কত ঘণ্টা চলবে (সর্বোচ্চ ৫)"
        default: "4"
  schedule:
    - cron: "0 */5 * * *"

concurrency:
  group: uncensored-agent
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      MODEL_TIER: ${{ github.event.inputs.model || '14b' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ফ্রি ডিস্ক দেখা
        run: df -h / && free -h

      - name: মডেল ক্যাশ
        uses: actions/cache@v4
        with:
          path: models
          key: model-${{ env.MODEL_TIER }}-v1

      - name: মডেল নামানো
        run: bash ci/fetch_model.sh

      - name: llama.cpp ক্যাশ
        uses: actions/cache@v4
        with:
          path: ~/llama.cpp/build
          key: llamacpp-build-v1

      - name: llama.cpp বিল্ড
        run: bash ci/build_llama.sh

      - name: সার্ভার + Telegram (টুলসহ)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_ALLOWED: ${{ secrets.TELEGRAM_ALLOWED }}
          AGENT_ENDPOINT: http://127.0.0.1:8080/v1/chat/completions
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          STATE_BRANCH: agent-state
          AGENT_CONTEXT: 6144
          AGENT_SELFTEST: "1"
        run: bash ci/serve_and_run.sh
